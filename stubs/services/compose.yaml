# Local services of the project (installed by alexxosipov/agentio): PostgreSQL with the development database
# and the "testing" database of the tests (phpunit.xml), Redis for the queues and Horizon.
# The credentials come from .env (DB_DATABASE, DB_USERNAME, DB_PASSWORD). Start: docker compose up -d
services:
    postgres:
        image: 'postgres:18-alpine'
        ports:
            - '${DB_PORT:-5432}:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'postgres:/var/lib/postgresql'
            - './docker/postgres/initdb:/docker-entrypoint-initdb.d'
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:7-alpine'
        ports:
            - '${REDIS_PORT:-6379}:6379'
        volumes:
            - 'redis:/data'
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
volumes:
    postgres:
        driver: local
    redis:
        driver: local
